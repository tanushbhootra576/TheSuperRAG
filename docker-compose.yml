version: "3.8"

services:
  backend:
    build: .
    container_name: superrag-backend
    ports:
      - "8000:8000"
    volumes:
      - ./DATA:/app/DATA
      - ./.env:/app/.env
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    container_name: superrag-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
